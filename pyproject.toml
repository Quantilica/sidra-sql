[project]
name = "sidra-sql"
version = "1.3.0"
description = "Tabelas de dados agregados do IBGE"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "sidra-fetcher @ git+https://github.com/Quantilica/sidra-fetcher.git@v0.7.0",
    "psycopg[binary]>=3.2.9",
    "sqlalchemy>=2.0.41",
    "orjson>=3.11.7",
    "platformdirs>=4.9.6",
    "typer>=0.24.1",
]

[project.scripts]
sidra-sql = "sidra_sql.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
